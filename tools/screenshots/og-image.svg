<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <clipPath id="card"><rect x="700" y="40" width="440" height="550" rx="22"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#00345a" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="#00a6f5"/>
  <!-- The ⁂ mark from tools/icons/icon.svg, drawn as lines so it needs no font. -->
  <g transform="translate(26 108) scale(0.42)" stroke="#fff" stroke-width="30" stroke-linecap="round">
    <line x1="256" y1="182" x2="256.0" y2="124.0"/>
    <line x1="256" y1="182" x2="311.2" y2="164.1"/>
    <line x1="256" y1="182" x2="290.1" y2="228.9"/>
    <line x1="256" y1="182" x2="221.9" y2="228.9"/>
    <line x1="256" y1="182" x2="200.8" y2="164.1"/>
    <line x1="172" y1="322" x2="172.0" y2="264.0"/>
    <line x1="172" y1="322" x2="227.2" y2="304.1"/>
    <line x1="172" y1="322" x2="206.1" y2="368.9"/>
    <line x1="172" y1="322" x2="137.9" y2="368.9"/>
    <line x1="172" y1="322" x2="116.8" y2="304.1"/>
    <line x1="340" y1="322" x2="340.0" y2="264.0"/>
    <line x1="340" y1="322" x2="395.2" y2="304.1"/>
    <line x1="340" y1="322" x2="374.1" y2="368.9"/>
    <line x1="340" y1="322" x2="305.9" y2="368.9"/>
    <line x1="340" y1="322" x2="284.8" y2="304.1"/>
  </g>
  <g fill="#fff" font-family="Inter, system-ui, sans-serif">
    <text x="210" y="255" font-size="132" font-weight="700" letter-spacing="-4">tap</text>
    <text font-size="36" font-weight="500" fill-opacity="0.95">
      <tspan x="72" y="370">Like, repost, reply or follow</tspan>
      <tspan x="72" y="418">from the share sheet, wherever</tspan>
      <tspan x="72" y="466">you find a Fediverse post.</tspan>
    </text>
  </g>
  <!-- The app with a post loaded from the mock server (tools/screenshots/capture.js). -->
  <rect x="700" y="40" width="440" height="550" rx="22" fill="#fff" filter="url(#shadow)"/>
  <image href="og-app.png" x="700" y="40" width="440" height="544" clip-path="url(#card)"/>
</svg>
